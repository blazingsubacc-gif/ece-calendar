<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ECE Collaborative Calendar App</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            touch-action: manipulation;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }

        .calendar-event-card {
            transition: transform 0.12s ease, box-shadow 0.12s ease;
        }
        .calendar-event-card:active {
            transform: scale(0.98);
        }

        /* Pulsing dot for real-time status */
        .live-dot {
            width: 8px;
            height: 8px;
            background-color: #10b981;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
            animation: pulse-green 2s infinite;
        }
        @keyframes pulse-green {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col overflow-hidden bg-slate-50 text-slate-800">

    <!-- Top Navigation Header -->
    <header class="bg-white border-b border-slate-200 px-3 py-2.5 flex-shrink-0 flex items-center justify-between gap-2 z-30 shadow-xs">
        
        <!-- Left Controls: Menu Toggle & Title -->
        <div class="flex items-center space-x-1.5 sm:space-x-3">
            <button onclick="toggleSidebar()" aria-label="Toggle Sidebar Menu" class="p-2.5 text-slate-600 hover:bg-slate-100 active:bg-slate-200 rounded-xl transition focus:outline-none min-w-[44px] min-h-[44px] flex items-center justify-center">
                <i class="fa-solid fa-bars text-lg"></i>
            </button>
            
            <div class="flex items-center space-x-2">
                <div class="bg-teal-600 text-white p-2 rounded-xl shadow-xs">
                    <i class="fa-solid fa-calendar-days text-base sm:text-lg"></i>
                </div>
                <h1 class="font-bold text-sm sm:text-base text-slate-800 tracking-tight hidden xs:block">ECE Calendar</h1>
            </div>

            <!-- Date Navigation Buttons -->
            <div class="flex items-center space-x-1 pl-1 sm:pl-3 border-l border-slate-200">
                <button onclick="navigateDate('today')" class="px-2.5 py-1.5 border border-slate-300 hover:bg-slate-100 active:bg-slate-200 text-slate-700 font-medium text-xs rounded-lg transition min-h-[38px]">
                    Today
                </button>
                <button onclick="navigateDate('prev')" aria-label="Previous" class="p-2 hover:bg-slate-100 active:bg-slate-200 text-slate-600 rounded-lg transition min-w-[38px] min-h-[38px] flex items-center justify-center">
                    <i class="fa-solid fa-chevron-left text-xs"></i>
                </button>
                <button onclick="navigateDate('next')" aria-label="Next" class="p-2 hover:bg-slate-100 active:bg-slate-200 text-slate-600 rounded-lg transition min-w-[38px] min-h-[38px] flex items-center justify-center">
                    <i class="fa-solid fa-chevron-right text-xs"></i>
                </button>
                <span id="current-range-label" class="font-bold text-xs sm:text-sm text-slate-800 pl-1.5 truncate max-w-[120px] sm:max-w-none">
                    --
                </span>
            </div>
        </div>

        <!-- Right Controls: Fullscreen, View Selector & Add Event -->
        <div class="flex items-center space-x-1.5 sm:space-x-2">
            
            <!-- Fullscreen Button -->
            <button id="fullscreen-btn" onclick="toggleFullscreen()" title="Toggle Fullscreen Mode" class="p-2.5 text-slate-600 hover:bg-slate-100 active:bg-slate-200 rounded-xl transition border border-slate-200 min-w-[44px] min-h-[44px] flex items-center justify-center">
                <i class="fa-solid fa-expand text-sm" id="fullscreen-icon"></i>
            </button>

            <!-- View Selector (Week / Month / Day) -->
            <div class="bg-slate-100 p-0.5 sm:p-1 rounded-xl flex items-center border border-slate-200 text-xs font-semibold">
                <button id="view-week-btn" onclick="setViewMode('week')" class="px-2.5 py-1.5 rounded-lg transition-all bg-white text-slate-800 shadow-xs">
                    Week
                </button>
                <button id="view-month-btn" onclick="setViewMode('month')" class="px-2.5 py-1.5 rounded-lg transition-all text-slate-600 hover:text-slate-800">
                    Month
                </button>
                <button id="view-day-btn" onclick="setViewMode('day')" class="px-2.5 py-1.5 rounded-lg transition-all text-slate-600 hover:text-slate-800">
                    Day
                </button>
            </div>

            <!-- Header Create Button (Desktop) -->
            <button onclick="openAddModal()" class="hidden md:flex bg-teal-600 hover:bg-teal-700 text-white font-semibold text-xs px-3.5 py-2.5 rounded-xl items-center gap-1.5 transition shadow-xs active:scale-95 min-h-[42px]">
                <i class="fa-solid fa-plus text-sm"></i>
                <span>Add Event</span>
            </button>
        </div>
    </header>

    <!-- App Body Main Container -->
    <div class="flex-1 flex overflow-hidden relative">
        
        <!-- Mobile Backdrop Overlay -->
        <div id="sidebar-backdrop" onclick="toggleSidebar()" class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs z-30 hidden transition-opacity"></div>

        <!-- Collapsible / Off-Canvas Sidebar -->
        <aside id="app-sidebar" class="fixed md:static inset-y-0 left-0 w-72 bg-white border-r border-slate-200 flex flex-col p-4 flex-shrink-0 transition-transform duration-300 ease-in-out z-40 -translate-x-full md:translate-x-0 shadow-lg md:shadow-none">
            
            <!-- Sidebar Close Header (Mobile) -->
            <div class="flex justify-between items-center mb-4 md:hidden pb-2 border-b border-slate-100">
                <div class="flex items-center space-x-2">
                    <span class="bg-teal-100 text-teal-800 p-1.5 rounded-lg text-xs font-bold">ECE 2nd Year</span>
                    <span class="text-xs text-slate-500">Menu Options</span>
                </div>
                <button onclick="toggleSidebar()" class="p-2 text-slate-400 hover:text-slate-600 rounded-lg min-w-[40px] min-h-[40px] flex items-center justify-center">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <!-- Create Event Button -->
            <button onclick="openAddModal()" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-semibold text-xs py-3 px-4 rounded-xl flex items-center justify-center gap-2 transition shadow-xs mb-4 active:scale-95 min-h-[44px]">
                <i class="fa-solid fa-plus"></i> Create New Event / Due
            </button>

            <!-- Layer Toggles -->
            <div class="space-y-5 flex-1 overflow-y-auto custom-scrollbar">
                <div>
                    <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">Calendars & Overlays</h3>
                    <div class="space-y-2.5">
                        
                        <!-- Base Schedule Checkbox -->
                        <label class="flex items-center justify-between p-2.5 rounded-xl hover:bg-slate-50 border border-slate-100 cursor-pointer transition select-none min-h-[44px]">
                            <div class="flex items-center space-x-2.5">
                                <span class="w-3.5 h-3.5 rounded-full bg-teal-500 inline-block shadow-xs"></span>
                                <span class="text-xs font-semibold text-slate-700">Base Class Schedule</span>
                            </div>
                            <input type="checkbox" id="toggle-base-schedule" checked onchange="handleOverlayToggle()" class="w-4 h-4 text-teal-600 rounded border-slate-300 focus:ring-teal-500 cursor-pointer">
                        </label>

                        <!-- Custom Events & Dues Checkbox -->
                        <label class="flex items-center justify-between p-2.5 rounded-xl hover:bg-slate-50 border border-slate-100 cursor-pointer transition select-none min-h-[44px]">
                            <div class="flex items-center space-x-2.5">
                                <span class="w-3.5 h-3.5 rounded-full bg-rose-500 inline-block shadow-xs"></span>
                                <span class="text-xs font-semibold text-slate-700">Custom Events / Dues</span>
                            </div>
                            <input type="checkbox" id="toggle-custom-events" checked onchange="handleOverlayToggle()" class="w-4 h-4 text-rose-600 rounded border-slate-300 focus:ring-rose-500 cursor-pointer">
                        </label>
                    </div>
                </div>

                <!-- Color Legend -->
                <div>
                    <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2.5">Color Legend</h3>
                    <div class="space-y-2 text-xs font-medium text-slate-600">
                        <div class="flex items-center gap-2">
                            <span class="w-2.5 h-2.5 rounded-full bg-teal-400"></span> Mon/Wed/Sat Classes
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="w-2.5 h-2.5 rounded-full bg-amber-400"></span> Thu/Fri Classes
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="w-2.5 h-2.5 rounded-full bg-rose-400"></span> Assignment Dues (11:59 PM)
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="w-2.5 h-2.5 rounded-full bg-indigo-400"></span> Exams & Personal Events
                        </div>
                    </div>
                </div>
            </div>

            <!-- Footer Sync Badge -->
            <div class="mt-auto pt-3 border-t border-slate-100 flex items-center justify-between text-xs text-slate-500">
                <span class="flex items-center gap-1.5 font-medium text-teal-600" id="sync-status-indicator">
                    <span class="live-dot"></span> Persistent Cloud Sync
                </span>
                <span class="text-[10px] text-slate-400">ECE 2nd Year</span>
            </div>
        </aside>

        <!-- Main Calendar Grid Area -->
        <main class="flex-1 overflow-hidden relative flex flex-col bg-white w-full">
            <div id="calendar-viewport" class="flex-1 overflow-auto custom-scrollbar relative">
                <!-- Dynamic Grid Rendered Here -->
            </div>
        </main>
    </div>

    <!-- Mobile Floating Action Button (FAB) -->
    <button onclick="openAddModal()" aria-label="Add Event" class="md:hidden fixed bottom-5 right-5 w-14 h-14 bg-teal-600 hover:bg-teal-700 text-white rounded-full shadow-lg flex items-center justify-center transition active:scale-90 z-20">
        <i class="fa-solid fa-plus text-xl"></i>
    </button>

    <!-- Modal Form for Creating / Editing Events -->
    <div id="event-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-3 z-50 hidden transition-opacity">
        <div class="bg-white rounded-2xl shadow-xl border border-slate-100 w-full max-w-lg overflow-hidden transform transition-all max-h-[92vh] flex flex-col">
            
            <!-- Modal Header -->
            <div class="bg-slate-50 border-b border-slate-200 px-5 py-3.5 flex justify-between items-center">
                <h3 id="modal-title" class="font-bold text-slate-800 text-sm sm:text-base flex items-center gap-2">
                    <i class="fa-solid fa-calendar-plus text-teal-600"></i>
                    <span>Add Event / Due</span>
                </h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 p-2 rounded-lg transition min-w-[40px] min-h-[40px] flex items-center justify-center">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <!-- Modal Form -->
            <form id="event-form" onsubmit="saveEvent(event)" class="p-5 space-y-3.5 overflow-y-auto custom-scrollbar flex-1">
                <input type="hidden" id="event-id">

                <!-- Title & Category -->
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <div class="sm:col-span-2">
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Title *</label>
                        <input type="text" id="event-title" required placeholder="e.g. Physics Problem Set 2" 
                            class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-teal-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Category *</label>
                        <select id="event-category" onchange="handleCategoryChange()" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-teal-500 outline-none bg-white">
                            <option value="due">Assignment / Due</option>
                            <option value="exam">Exam / Quiz</option>
                            <option value="base">Base Class</option>
                            <option value="personal">Personal / Other</option>
                        </select>
                    </div>
                </div>

                <!-- Recurrence Type Switch -->
                <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-200">
                    <label class="block text-xs font-semibold text-slate-700 mb-1.5">Schedule Behavior *</label>
                    <div class="grid grid-cols-2 gap-2 text-xs">
                        <label class="flex items-center gap-2 p-2 rounded-lg border bg-white border-slate-200 cursor-pointer">
                            <input type="radio" name="recurrence" id="rec-onetime" value="onetime" checked onchange="toggleRecurrenceUI()" class="text-teal-600 focus:ring-teal-500">
                            <span class="font-medium text-slate-800">One-time (Specific Date)</span>
                        </label>
                        <label class="flex items-center gap-2 p-2 rounded-lg border bg-white border-slate-200 cursor-pointer">
                            <input type="radio" name="recurrence" id="rec-weekly" value="weekly" onchange="toggleRecurrenceUI()" class="text-teal-600 focus:ring-teal-500">
                            <span class="font-medium text-slate-800">Weekly Class Schedule</span>
                        </label>
                    </div>
                </div>

                <!-- Date or Day Picker -->
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <div id="date-picker-container">
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Target Date *</label>
                        <input type="date" id="event-date" required
                            class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-teal-500 outline-none">
                    </div>
                    <div id="day-picker-container" class="hidden">
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Day of Week *</label>
                        <select id="event-day" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-teal-500 outline-none bg-white">
                            <option value="Monday">Monday</option>
                            <option value="Tuesday">Tuesday</option>
                            <option value="Wednesday">Wednesday</option>
                            <option value="Thursday">Thursday</option>
                            <option value="Friday">Friday</option>
                            <option value="Saturday">Saturday</option>
                            <option value="Sunday">Sunday</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Start Time *</label>
                        <input type="time" id="event-start" min="07:00" max="23:59" required
                            class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-teal-500 outline-none">
                    </div>
                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <label class="text-xs font-semibold text-slate-600">End Time *</label>
                            <button type="button" onclick="setEndTime1159()" class="text-[10px] text-teal-600 hover:text-teal-800 font-bold">11:59 PM</button>
                        </div>
                        <input type="time" id="event-end" min="07:00" max="23:59" required
                            class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-teal-500 outline-none">
                    </div>
                </div>

                <!-- Location & Color -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Location / Room</label>
                        <input type="text" id="event-location" placeholder="e.g. Canvas, M-402, VR-CAS" 
                            class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-teal-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Theme Color</label>
                        <select id="event-color" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-teal-500 outline-none bg-white">
                            <option value="rose">Rose / Red (Assignment Due)</option>
                            <option value="indigo">Indigo / Blue (Exam & Personal)</option>
                            <option value="teal">Teal / Green (Mon/Wed/Sat Schedule)</option>
                            <option value="yellow">Yellow (Thu/Fri Schedule)</option>
                            <option value="grey">Soft Grey (Other Classes)</option>
                        </select>
                    </div>
                </div>

                <!-- Notes -->
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Notes / Submission Details</label>
                    <textarea id="event-notes" rows="2" placeholder="Submission instructions, links, or specific study topics..." 
                        class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-teal-500 outline-none resize-none"></textarea>
                </div>

                <!-- Modal Actions -->
                <div class="flex items-center justify-between pt-3 border-t border-slate-200">
                    <button type="button" id="btn-delete" onclick="deleteCurrentEvent()" class="text-xs text-rose-600 hover:text-rose-800 font-medium px-3 py-2 rounded-lg hover:bg-rose-50 transition hidden min-h-[40px]">
                        <i class="fa-solid fa-trash me-1"></i> Delete
                    </button>
                    <div class="flex items-center space-x-2 ml-auto">
                        <button type="button" onclick="closeModal()" class="px-4 py-2 text-xs font-medium text-slate-600 hover:text-slate-800 hover:bg-slate-100 rounded-lg transition min-h-[40px]">
                            Cancel
                        </button>
                        <button type="submit" class="px-4 py-2 text-xs font-semibold text-white bg-teal-600 hover:bg-teal-700 rounded-lg transition shadow-xs min-h-[40px]">
                            Save Item
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 md:translate-x-0 md:left-auto md:right-5 bg-slate-800 text-white px-4 py-3 rounded-xl shadow-lg border border-slate-700 flex items-center space-x-3 text-xs z-50 transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none min-w-[250px]">
        <i class="fa-solid fa-circle-check text-teal-400 text-base" id="toast-icon"></i>
        <span id="toast-message">Calendar updated successfully</span>
    </div>

    <!-- Application Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

            : { apiKey: "demo", authDomain: "demo.firebaseapp.com", projectId: "demo" };

        let app, db, auth;
        let currentUser = null;
        let eventsData = {};

        let showBaseSchedule = true;
        let showCustomEvents = true;

        let currentViewMode = 'week';
        let currentDate = new Date();

        const TOTAL_GRID_HOURS = 17; // 7:00 AM to 00:00 AM midnight

            // SATURDAY
            { id: "ece_s1", title: "Computer Fund. & Programming", day: "Saturday", isWeekly: true, start: "07:30", end: "10:30", location: "M-201", color: "teal", category: "base", notes: "Mon/Wed/Sat Schedule" },
            { id: "ece_s2", title: "Physics 2 Lab", day: "Saturday", isWeekly: true, start: "11:00", end: "14:00", location: "M-419", color: "teal", category: "base", notes: "Mon/Wed/Sat Schedule" },
            { id: "ece_s3", title: "PATHFIT 3", day: "Saturday", isWeekly: true, start: "15:00", end: "17:00", location: "NG1", color: "teal", category: "base", notes: "Mon/Wed/Sat Schedule" }
        ];

        async function initApp() {
            document.getElementById('event-date').value = formatDateISO(currentDate);

            // Load initial state from local cache immediately
            loadLocalStorageEvents();

            try {
                app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);

                // Authenticate FIRST before making query
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }

                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        currentUser = user;
                        listenToCalendarEvents();
                    }
                });
            } catch (err) {
                console.warn("Using offline localStorage persistence:", err);
                if (Object.keys(eventsData).length === 0) {
                    loadLocalDefaultSchedule();
                }
            }

            renderCalendarView();
        }

        function loadLocalStorageEvents() {
            try {
                const saved = localStorage.getItem(LOCAL_STORAGE_KEY);
                if (saved) {
                    eventsData = JSON.parse(saved);
                }
            } catch (e) {
                console.warn("Could not read localStorage:", e);
            }
        }

        function saveToLocalStorage() {
            try {
                localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(eventsData));
            } catch (e) {
                console.warn("Could not write to localStorage:", e);
            }
        }

        function listenToCalendarEvents() {
            if (!currentUser) return;
            const eventsCol = collection(db, 'artifacts', appId, 'public', 'data', 'calendar_events');

            onSnapshot(eventsCol, async (snapshot) => {
                if (snapshot.empty) {
                    // Seed initial schedule to Firestore so users can edit/delete base classes persistently
                    await seedDefaultEvents();
                    return;
                }

                eventsData = {};
                snapshot.forEach((docSnap) => {
                    eventsData[docSnap.id] = { id: docSnap.id, ...docSnap.data() };
                });

                saveToLocalStorage();
                renderCalendarView();
            }, (err) => {
                console.error("Firestore error:", err);
                if (Object.keys(eventsData).length === 0) {
                    loadLocalDefaultSchedule();
                }
            });
        }

        async function seedDefaultEvents() {
            if (!currentUser) return;
            for (const item of DEFAULT_ECE_BASE_SCHEDULE) {
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'calendar_events', item.id);
                await setDoc(docRef, item);
            }
        }

        function loadLocalDefaultSchedule() {
            eventsData = {};
            DEFAULT_ECE_BASE_SCHEDULE.forEach(item => {
                eventsData[item.id] = item;
            });
            saveToLocalStorage();
            renderCalendarView();
        }

        function getWeekDateRange(refDate) {
            const curr = new Date(refDate);
            const day = curr.getDay(); // 0 is Sun
            const diffToMon = curr.getDate() - day + (day === 0 ? -6 : 1);
            
            const startMon = new Date(curr.setDate(diffToMon));
            startMon.setHours(0,0,0,0);

            const dates = [];
            for (let i = 0; i < 7; i++) {
                const d = new Date(startMon);
                d.setDate(d.getDate() + i);
                dates.push(d);
            }
            return dates;
        }

        function getFilteredEventsForDate(targetDate) {
            const targetISO = formatDateISO(targetDate);
            const dayName = targetDate.toLocaleDateString('en-US', { weekday: 'long' });

            return Object.values(eventsData).filter(event => {
                const isBase = event.category === 'base' || event.id.startsWith('ece_');
                if (isBase && !showBaseSchedule) return false;
                if (!isBase && !showCustomEvents) return false;

                if (event.isWeekly || event.category === 'base') {
                    return event.day === dayName;
                } else {
                    return event.date === targetISO;
                }
            });
        }

        function renderCalendarView() {
            updateRangeLabel();
            const viewport = document.getElementById('calendar-viewport');

            if (currentViewMode === 'week') {
                renderWeekView(viewport);
            } else if (currentViewMode === 'month') {
                renderMonthView(viewport);
            } else if (currentViewMode === 'day') {
                renderDayView(viewport);
            }
        }

        // 1. WEEK VIEW
        function renderWeekView(container) {
            const weekDates = getWeekDateRange(currentDate);
            const weekDays = weekDates.slice(0, 6); // Mon to Sat
            const hours = Array.from({ length: TOTAL_GRID_HOURS }, (_, i) => i + GRID_START_HOUR);

            let html = `
                <div class="min-w-[700px] md:min-w-[880px] flex flex-col h-full">
                    <!-- Day Headers with Dates -->
                    <div class="flex sticky top-0 bg-white border-b border-slate-200 z-20 font-semibold text-xs text-slate-700 shadow-2xs">
                        <div class="w-14 sm:w-20 flex-shrink-0 p-2.5 text-center border-r border-slate-200 bg-slate-50 text-slate-400">
                            TIME
                        </div>
                        <div class="flex-1 grid grid-cols-6 divide-x divide-slate-200">
            `;

            weekDays.forEach((dateObj) => {
                const dayName = dateObj.toLocaleDateString('en-US', { weekday: 'short' });
                const dayNum = dateObj.getDate();
                const isToday = new Date().toDateString() === dateObj.toDateString();

                html += `
                    <div class="p-2 text-center ${isToday ? 'bg-teal-50/50' : 'bg-white'}">
                        <span class="block text-[10px] uppercase tracking-wider ${isToday ? 'text-teal-700 font-bold' : 'text-slate-400'}">${dayName}</span>
                        <span class="inline-block text-sm font-extrabold ${isToday ? 'bg-teal-600 text-white w-6 h-6 leading-6 rounded-full mt-0.5' : 'text-slate-800'}">${dayNum}</span>
                    </div>
                `;
            });

            html += `
                        </div>
                    </div>

                    <!-- Timetable Grid -->
                    <div class="flex flex-1 relative" style="min-height: ${TOTAL_GRID_HOURS * HOUR_HEIGHT}px;">
                        <!-- Time Scale Column -->
                        <div class="w-14 sm:w-20 flex-shrink-0 border-r border-slate-200 bg-slate-50/50 text-[10px] sm:text-[11px] font-medium text-slate-400 select-none z-10">
            `;

            hours.forEach(h => {
                let formatted = h > 12 ? `${h - 12} PM` : h === 12 ? '12 PM' : `${h} AM`;
                if (h === 23) formatted = '11 PM';
                if (h === 24) formatted = '12 AM';

                html += `<div style="height: ${HOUR_HEIGHT}px;" class="border-b border-slate-200 text-center pt-1.5">${formatted}</div>`;
            });

            html += `
                        </div>

                        <!-- Days Columns Grid -->
                        <div class="flex-1 grid grid-cols-6 divide-x divide-slate-200 relative">
            `;

            weekDays.forEach((dateObj) => {
                const isoStr = formatDateISO(dateObj);
                html += `
                    <div class="day-column relative h-full hover:bg-slate-50/40 transition-colors cursor-pointer" onclick="handleGridClick(event, '${isoStr}')">
                        ${hours.map(() => `<div style="height: ${HOUR_HEIGHT}px;" class="border-b border-slate-100"></div>`).join('')}
                    </div>
                `;
            });

            html += `
                            <!-- Dynamic Cards Overlay -->
                            <div id="events-overlay-container" class="absolute inset-0 pointer-events-none"></div>
                        </div>
                    </div>
                </div>
            `;

            container.innerHTML = html;
            renderWeekEventCards(weekDays);
        }

        function renderWeekEventCards(weekDays) {
            const overlay = document.getElementById('events-overlay-container');
            if (!overlay) return;

            weekDays.forEach((dateObj, colIndex) => {
                const dayEvents = getFilteredEventsForDate(dateObj);

                dayEvents.forEach(event => {
                    const [startH, startM] = event.start.split(':').map(Number);
                    
                    let [endH, endM] = event.end.split(':').map(Number);
                    if (endH === 23 && endM >= 59) {
                        endH = 24;
                        endM = 0;
                    }

                    const startTotalHours = (startH + startM / 60) - GRID_START_HOUR;
                    const endTotalHours = (endH + endM / 60) - GRID_START_HOUR;
                    const durationHours = Math.max(endTotalHours - startTotalHours, 0.4);

                    if (startTotalHours < 0) return;

                    const topPx = startTotalHours * HOUR_HEIGHT;
                    const heightPx = durationHours * HOUR_HEIGHT;
                    const colorTheme = getColorClasses(event.color || 'teal');

                    const card = document.createElement('div');
                    card.className = `calendar-event-card absolute pointer-events-auto rounded-xl p-2 border cursor-pointer flex flex-col justify-between overflow-hidden shadow-xs ${colorTheme.bg} ${colorTheme.border} ${colorTheme.text}`;
                    
                    card.style.top = `${topPx}px`;
                    card.style.height = `${Math.max(heightPx - 3, 28)}px`;
                    card.style.left = `calc(${colIndex * (100 / 6)}% + 2px)`;
                    card.style.width = `calc(${100 / 6}% - 4px)`;

                    const isDue = event.category === 'due' || event.color === 'rose';

                    card.innerHTML = `
                        <div>
                            <div class="flex items-center justify-between opacity-85 text-[9px] sm:text-[10px] font-bold mb-0.5">
                                <span>${formatTime12H(event.start)} - ${formatTime12H(event.end)}</span>
                                ${isDue ? `<span class="bg-rose-600 text-white px-1 rounded text-[8px] uppercase font-bold">DUE</span>` : ''}
                            </div>
                            <h4 class="font-bold text-xs leading-tight line-clamp-2">${escapeHtml(event.title)}</h4>
                            ${event.location ? `<p class="text-[9px] font-medium opacity-85 mt-0.5 truncate"><i class="fa-solid fa-location-dot me-0.5"></i>${escapeHtml(event.location)}</p>` : ''}
                        </div>
                    `;

                    card.onclick = (e) => {
                        e.stopPropagation();
                        openEditModal(event.id);
                    };

                    overlay.appendChild(card);
                });
            });
        }

        // 2. MONTH VIEW
        function renderMonthView(container) {
            const daysOfWeek = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            const firstDayOfMonth = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            let html = `
                <div class="p-2 sm:p-4 max-w-6xl mx-auto h-full flex flex-col">
                    <div class="grid grid-cols-7 border-b border-slate-200 pb-2 mb-2 text-center text-xs font-bold text-slate-500 uppercase tracking-wider">
                        ${daysOfWeek.map(d => `<div>${d}</div>`).join('')}
                    </div>
                    <div class="grid grid-cols-7 gap-1 flex-1 min-h-[500px]">
            `;

            for (let i = 0; i < firstDayOfMonth; i++) {
                html += `<div class="bg-slate-50/50 rounded-lg p-1 border border-slate-100 opacity-30"></div>`;
            }

            for (let day = 1; day <= daysInMonth; day++) {
                const dateObj = new Date(year, month, day);
                const isToday = new Date().toDateString() === dateObj.toDateString();
                const matchingEvents = getFilteredEventsForDate(dateObj);

                html += `
                    <div onclick="openAddModal('${formatDateISO(dateObj)}')" class="bg-white border ${isToday ? 'border-teal-500 ring-2 ring-teal-100' : 'border-slate-200'} rounded-xl p-1.5 flex flex-col justify-between hover:border-slate-300 transition overflow-hidden cursor-pointer">
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-xs font-bold ${isToday ? 'bg-teal-600 text-white rounded-full w-5 h-5 flex items-center justify-center' : 'text-slate-700'}">${day}</span>
                        </div>
                        <div class="space-y-1 overflow-y-auto custom-scrollbar flex-1 max-h-[85px]">
                `;

                matchingEvents.forEach(evt => {
                    const theme = getColorClasses(evt.color || 'teal');
                    html += `
                        <div onclick="event.stopPropagation(); openEditModal('${evt.id}')" class="text-[9px] sm:text-[10px] px-1 py-0.5 rounded ${theme.bg} ${theme.text} font-semibold truncate hover:opacity-90">
                            ${evt.category === 'due' ? '⚠️ ' : ''}${escapeHtml(evt.title)} (${formatTime12H(evt.end)})
                        </div>
                    `;
                });

                html += `
                        </div>
                    </div>
                `;
            }

            html += `
                    </div>
                </div>
            `;

            container.innerHTML = html;
        }

        // 3. DAY VIEW
        function renderDayView(container) {
            const hours = Array.from({ length: TOTAL_GRID_HOURS }, (_, i) => i + GRID_START_HOUR);
            const dayEvents = getFilteredEventsForDate(currentDate);
            const formattedDateStr = currentDate.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric', year: 'numeric' });

            let html = `
                <div class="max-w-2xl mx-auto p-3 sm:p-4 h-full flex flex-col">
                    <div class="text-center font-bold text-slate-800 text-sm sm:text-base mb-3 bg-slate-100 py-1.5 rounded-xl border border-slate-200">
                        ${formattedDateStr}
                    </div>

                    <!-- Daily Hour Timeline -->
                    <div class="bg-white border border-slate-200 rounded-2xl shadow-xs overflow-hidden flex-1 relative custom-scrollbar overflow-y-auto" style="min-height: ${TOTAL_GRID_HOURS * HOUR_HEIGHT}px;">
            `;

            hours.forEach(h => {
                let formatted = h > 12 ? `${h - 12}:00 PM` : h === 12 ? '12:00 PM' : `${h}:00 AM`;
                if (h === 23) formatted = '11:00 PM';
                if (h === 24) formatted = '12:00 AM';

                html += `
                    <div class="flex border-b border-slate-100 relative" style="min-height: ${HOUR_HEIGHT}px;">
                        <div class="w-16 sm:w-20 p-2 text-center text-xs font-medium text-slate-400 border-r border-slate-100 bg-slate-50/50">
                            ${formatted}
                        </div>
                        <div class="flex-1 relative p-1 cursor-pointer" onclick="handleDayGridClick(event, '${formatDateISO(currentDate)}', ${h})">
                        </div>
                    </div>
                `;
            });

            html += `<div id="day-events-layer" class="absolute inset-0 pointer-events-none pl-16 sm:pl-20"></div></div></div>`;

            container.innerHTML = html;

            const dayLayer = document.getElementById('day-events-layer');

            dayEvents.forEach(event => {
                const [startH, startM] = event.start.split(':').map(Number);
                
                let [endH, endM] = event.end.split(':').map(Number);
                if (endH === 23 && endM >= 59) {
                    endH = 24;
                    endM = 0;
                }

                const startTotalHours = (startH + startM / 60) - GRID_START_HOUR;
                const endTotalHours = (endH + endM / 60) - GRID_START_HOUR;
                const durationHours = Math.max(endTotalHours - startTotalHours, 0.4);

                if (startTotalHours < 0) return;

                const topPx = startTotalHours * HOUR_HEIGHT;
                const heightPx = durationHours * HOUR_HEIGHT;
                const colorTheme = getColorClasses(event.color || 'teal');

                const card = document.createElement('div');
                card.className = `calendar-event-card absolute pointer-events-auto rounded-xl p-2.5 sm:p-3 border cursor-pointer flex flex-col justify-between overflow-hidden shadow-xs ${colorTheme.bg} ${colorTheme.border} ${colorTheme.text}`;
                
                card.style.top = `${topPx + 4}px`;
                card.style.height = `${Math.max(heightPx - 8, 38)}px`;
                card.style.left = `8px`;
                card.style.right = `8px`;

                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div>
                            <div class="flex items-center gap-2">
                                <h4 class="font-bold text-xs sm:text-sm leading-snug">${escapeHtml(event.title)}</h4>
                                ${event.category === 'due' ? `<span class="bg-rose-600 text-white font-semibold text-[8px] px-1.5 py-0.5 rounded uppercase">DUE</span>` : ''}
                            </div>
                            ${event.location ? `<p class="text-[10px] font-medium opacity-85 mt-0.5"><i class="fa-solid fa-location-dot me-1"></i>${escapeHtml(event.location)}</p>` : ''}
                        </div>
                        <span class="text-[10px] font-bold px-2 py-0.5 bg-white/60 rounded-md whitespace-nowrap">${formatTime12H(event.start)} - ${formatTime12H(event.end)}</span>
                    </div>
                `;

                card.onclick = (e) => {
                    e.stopPropagation();
                    openEditModal(event.id);
                };

                dayLayer.appendChild(card);
            });
        }

        function getColorClasses(colorKey) {
            const map = {
                teal: { bg: 'bg-teal-100/95 hover:bg-teal-100', border: 'border-teal-400', text: 'text-teal-950' },
                yellow: { bg: 'bg-amber-100/95 hover:bg-amber-100', border: 'border-amber-400', text: 'text-amber-950' },
                grey: { bg: 'bg-slate-200/90 hover:bg-slate-200', border: 'border-slate-400', text: 'text-slate-900' },
                rose: { bg: 'bg-rose-100/95 hover:bg-rose-100', border: 'border-rose-400', text: 'text-rose-950' },
                indigo: { bg: 'bg-indigo-100/95 hover:bg-indigo-100', border: 'border-indigo-400', text: 'text-indigo-950' }
            };
            return map[colorKey] || map.teal;
        }

        window.handleOverlayToggle = function() {
            showBaseSchedule = document.getElementById('toggle-base-schedule').checked;
            showCustomEvents = document.getElementById('toggle-custom-events').checked;
            renderCalendarView();
        };

        window.toggleSidebar = function() {
            const sidebar = document.getElementById('app-sidebar');
            const backdrop = document.getElementById('sidebar-backdrop');

            if (sidebar.classList.contains('-translate-x-full')) {
                sidebar.classList.remove('-translate-x-full');
                backdrop.classList.remove('hidden');
            } else {
                sidebar.classList.add('-translate-x-full');
                backdrop.classList.add('hidden');
            }
        };

        window.toggleFullscreen = function() {
            const docEl = document.documentElement;
            if (!document.fullscreenElement && !document.webkitFullscreenElement && !document.msFullscreenElement) {
                if (docEl.requestFullscreen) docEl.requestFullscreen();
                else if (docEl.webkitRequestFullscreen) docEl.webkitRequestFullscreen();
                else if (docEl.msRequestFullscreen) docEl.msRequestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
                else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                else if (document.msExitFullscreen) document.msExitFullscreen();
            }
        };

        function handleFullscreenChange() {
            const isFullscreen = !!(document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement);
            const icon = document.getElementById('fullscreen-icon');
            const btn = document.getElementById('fullscreen-btn');

            if (isFullscreen) {
                icon.className = 'fa-solid fa-compress text-sm';
                btn.title = 'Exit Fullscreen Mode';
                btn.classList.add('bg-slate-100', 'text-teal-700');
            } else {
                icon.className = 'fa-solid fa-expand text-sm';
                btn.title = 'Toggle Fullscreen Mode';
                btn.classList.remove('bg-slate-100', 'text-teal-700');
            }
        }

        document.addEventListener('fullscreenchange', handleFullscreenChange);
        document.addEventListener('webkitfullscreenchange', handleFullscreenChange);
        document.addEventListener('msfullscreenchange', handleFullscreenChange);

        window.setEndTime1159 = function() {
            document.getElementById('event-end').value = '23:59';
        };

        window.handleCategoryChange = function() {
            const category = document.getElementById('event-category').value;
            const recWeekly = document.getElementById('rec-weekly');
            const recOnetime = document.getElementById('rec-onetime');
            const colorSelect = document.getElementById('event-color');

            if (category === 'base') {
                recWeekly.checked = true;
                colorSelect.value = 'teal';
            } else {
                recOnetime.checked = true;
                if (category === 'due') {
                    colorSelect.value = 'rose';
                    document.getElementById('event-end').value = '23:59';
                } else if (category === 'exam' || category === 'personal') {
                    colorSelect.value = 'indigo';
                }
            }
            toggleRecurrenceUI();
        };

        window.toggleRecurrenceUI = function() {
            const isWeekly = document.getElementById('rec-weekly').checked;
            const dateContainer = document.getElementById('date-picker-container');
            const dayContainer = document.getElementById('day-picker-container');

            if (isWeekly) {
                dateContainer.classList.add('hidden');
                dayContainer.classList.remove('hidden');
                document.getElementById('event-date').required = false;
            } else {
                dateContainer.classList.remove('hidden');
                dayContainer.classList.add('hidden');
                document.getElementById('event-date').required = true;
            }
        };

        window.setViewMode = function(mode) {
            currentViewMode = mode;
            ['week', 'month', 'day'].forEach(m => {
                const btn = document.getElementById(`view-${m}-btn`);
                if (m === mode) {
                    btn.classList.add('bg-white', 'text-slate-800', 'shadow-xs');
                    btn.classList.remove('text-slate-600');
                } else {
                    btn.classList.remove('bg-white', 'text-slate-800', 'shadow-xs');
                    btn.classList.add('text-slate-600');
                }
            });
            renderCalendarView();
        };

        window.navigateDate = function(direction) {
            if (direction === 'today') {
                currentDate = new Date();
            } else if (direction === 'next') {
                if (currentViewMode === 'month') currentDate.setMonth(currentDate.getMonth() + 1);
                else if (currentViewMode === 'day') currentDate.setDate(currentDate.getDate() + 1);
                else currentDate.setDate(currentDate.getDate() + 7);
            } else if (direction === 'prev') {
                if (currentViewMode === 'month') currentDate.setMonth(currentDate.getMonth() - 1);
                else if (currentViewMode === 'day') currentDate.setDate(currentDate.getDate() - 1);
                else currentDate.setDate(currentDate.getDate() - 7);
            }
            renderCalendarView();
        };

        function updateRangeLabel() {
            const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
            const label = document.getElementById('current-range-label');

            if (currentViewMode === 'month') {
                label.textContent = `${monthNames[currentDate.getMonth()]} ${currentDate.getFullYear()}`;
            } else if (currentViewMode === 'day') {
                label.textContent = `${monthNames[currentDate.getMonth()]} ${currentDate.getDate()}, ${currentDate.getFullYear()}`;
            } else {
                const weekDates = getWeekDateRange(currentDate);
                const start = weekDates[0];
                const end = weekDates[5];
                label.textContent = `${monthNames[start.getMonth()]} ${start.getDate()} - ${monthNames[end.getMonth()]} ${end.getDate()}`;
            }
        }

        window.handleGridClick = function(e, dateStr) {
            const rect = e.currentTarget.getBoundingClientRect();
            const clickY = e.clientY - rect.top;
            const hourClicked = Math.floor(clickY / HOUR_HEIGHT) + GRID_START_HOUR;
            const clampedHour = Math.min(Math.max(hourClicked, GRID_START_HOUR), 23);

            const startStr = `${String(clampedHour).padStart(2, '0')}:00`;
            const endStr = clampedHour === 23 ? '23:59' : `${String(clampedHour + 1).padStart(2, '0')}:00`;

            openAddModal(dateStr, startStr, endStr);
        };

        window.handleDayGridClick = function(e, dateStr, hour) {
            const startStr = `${String(hour).padStart(2, '0')}:00`;
            const endStr = hour === 23 ? '23:59' : `${String(hour + 1).padStart(2, '0')}:00`;
            openAddModal(dateStr, startStr, endStr);
        };

        window.openAddModal = function(targetDateStr = null, start = '10:00', end = '23:59') {
            document.getElementById('modal-title').innerHTML = `<i class="fa-solid fa-calendar-plus text-teal-600"></i> Add Event / Due`;
            document.getElementById('event-id').value = '';
            document.getElementById('event-title').value = '';
            document.getElementById('event-category').value = 'due';
            
            document.getElementById('rec-onetime').checked = true;
            toggleRecurrenceUI();

            const targetDate = targetDateStr ? new Date(targetDateStr) : currentDate;
            document.getElementById('event-date').value = formatDateISO(targetDate);
            document.getElementById('event-day').value = targetDate.toLocaleDateString('en-US', { weekday: 'long' });

            document.getElementById('event-start').value = start;
            document.getElementById('event-end').value = end;
            document.getElementById('event-location').value = 'Canvas';
            document.getElementById('event-notes').value = '';
            document.getElementById('event-color').value = 'rose';
            
            document.getElementById('btn-delete').classList.add('hidden');
            document.getElementById('event-modal').classList.remove('hidden');

            const sidebar = document.getElementById('app-sidebar');
            const backdrop = document.getElementById('sidebar-backdrop');
            sidebar.classList.add('-translate-x-full');
            backdrop.classList.add('hidden');
        };

        window.openEditModal = function(eventId) {
            const event = eventsData[eventId];
            if (!event) return;

            document.getElementById('modal-title').innerHTML = `<i class="fa-solid fa-pen-to-square text-teal-600"></i> Edit Item`;
            document.getElementById('event-id').value = event.id;
            document.getElementById('event-title').value = event.title || '';
            document.getElementById('event-category').value = event.category || (event.id.startsWith('ece_') ? 'base' : 'due');

            if (event.isWeekly || event.category === 'base') {
                document.getElementById('rec-weekly').checked = true;
            } else {
                document.getElementById('rec-onetime').checked = true;
            }
            toggleRecurrenceUI();

            if (event.date) document.getElementById('event-date').value = event.date;
            document.getElementById('event-day').value = event.day || 'Monday';

            document.getElementById('event-start').value = event.start || '08:00';
            document.getElementById('event-end').value = event.end || '23:59';
            document.getElementById('event-location').value = event.location || '';
            document.getElementById('event-notes').value = event.notes || '';
            document.getElementById('event-color').value = event.color || 'teal';

            document.getElementById('btn-delete').classList.remove('hidden');
            document.getElementById('event-modal').classList.remove('hidden');
        };

        window.closeModal = function() {
            document.getElementById('event-modal').classList.add('hidden');
        };

        window.saveEvent = async function(e) {
            e.preventDefault();
            
            const id = document.getElementById('event-id').value || `event_${Date.now()}`;
            const isWeekly = document.getElementById('rec-weekly').checked;
            
            const eventData = {
                title: document.getElementById('event-title').value.trim(),
                category: document.getElementById('event-category').value,
                isWeekly: isWeekly,
                start: document.getElementById('event-start').value,
                end: document.getElementById('event-end').value,
                location: document.getElementById('event-location').value.trim(),
                notes: document.getElementById('event-notes').value.trim(),
                color: document.getElementById('event-color').value,
                updatedAt: new Date().toISOString()
            };

            if (isWeekly) {
                eventData.day = document.getElementById('event-day').value;
            } else {
                const dateVal = document.getElementById('event-date').value;
                eventData.date = dateVal;
                const dateObj = new Date(dateVal + 'T00:00:00');
                eventData.day = dateObj.toLocaleDateString('en-US', { weekday: 'long' });
            }

            if (eventData.start >= eventData.end) {
                showToast("End time must be after start time!", "amber");
                return;
            }

            // Instantly save to local memory & localStorage so edits never disappear
            eventsData[id] = { id, ...eventData };
            saveToLocalStorage();
            renderCalendarView();

            try {
                if (db && currentUser) {
                    const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'calendar_events', id);
                    await setDoc(docRef, eventData);
                }
                showToast("Calendar entry saved permanently!");
                closeModal();
            } catch (err) {
                console.error("Save error:", err);
                showToast("Saved locally (offline mode active)", "amber");
                closeModal();
            }
        };

        window.deleteCurrentEvent = async function() {
            const id = document.getElementById('event-id').value;
            if (!id) return;

            // Instantly update local state
            delete eventsData[id];
            saveToLocalStorage();
            renderCalendarView();

            try {
                if (db && currentUser) {
                    const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'calendar_events', id);
                    await deleteDoc(docRef);
                }
                showToast("Entry removed permanently!");
                closeModal();
            } catch (err) {
                console.error("Delete error:", err);
                showToast("Removed locally (offline mode active)", "amber");
                closeModal();
            }
        };

        function formatDateISO(d) {
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function formatTime12H(time24) {
            if (!time24) return '';
            let [h, m] = time24.split(':').map(Number);
            if (h === 23 && m >= 59) return '11:59PM';
            const period = h >= 12 ? 'PM' : 'AM';
            const displayH = h % 12 || 12;
            return `${displayH}:${m.toString().padStart(2, '0')}${period}`;
        }

        function escapeHtml(str) {
            return (str || '').replace(/[&<>"']/g, (m) => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
            })[m]);
        }

        function showToast(message, type = 'teal') {
            const toast = document.getElementById('toast');
            const msgSpan = document.getElementById('toast-message');
            const icon = document.getElementById('toast-icon');

            msgSpan.textContent = message;
            if (type === 'rose') icon.className = "fa-solid fa-circle-exclamation text-rose-400 text-base";
            else if (type === 'amber') icon.className = "fa-solid fa-triangle-exclamation text-amber-400 text-base";
            else icon.className = "fa-solid fa-circle-check text-teal-400 text-base";

            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        window.addEventListener('load', initApp);
    </script>
</body>
</html>
